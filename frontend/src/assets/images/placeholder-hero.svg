<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a2e"/>
      <stop offset="45%" stop-color="#2a5e46"/>
      <stop offset="100%" stop-color="#3d7a5a"/>
    </linearGradient>
    <linearGradient id="mtn1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b4a38"/>
      <stop offset="100%" stop-color="#2d6e52"/>
    </linearGradient>
    <linearGradient id="mtn2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22573f"/>
      <stop offset="100%" stop-color="#3a7c5e"/>
    </linearGradient>
    <linearGradient id="mtn3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a6248"/>
      <stop offset="100%" stop-color="#458f6a"/>
    </linearGradient>
    <linearGradient id="field1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a8a5c"/>
      <stop offset="100%" stop-color="#4da870"/>
    </linearGradient>
    <linearGradient id="field2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#44a06a"/>
      <stop offset="100%" stop-color="#58bf82"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a7ba0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3592b8" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="sun" cx="20%" cy="18%" r="12%">
      <stop offset="0%" stop-color="#f0d080" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f0d080" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1440" height="720" fill="url(#sky)"/>

  <!-- Sun glow -->
  <ellipse cx="288" cy="130" rx="170" ry="90" fill="url(#sun)"/>

  <!-- Distant mist / clouds -->
  <ellipse cx="400" cy="310" rx="380" ry="45" fill="white" fill-opacity="0.06" filter="url(#blur1)"/>
  <ellipse cx="1050" cy="290" rx="320" ry="38" fill="white" fill-opacity="0.05" filter="url(#blur1)"/>
  <ellipse cx="700" cy="340" rx="260" ry="30" fill="white" fill-opacity="0.04" filter="url(#blur1)"/>

  <!-- Far mountains layer 1 -->
  <polygon points="0,420 120,230 260,360 400,210 560,320 700,190 850,310 1000,200 1140,340 1300,210 1440,300 1440,500 0,500" fill="url(#mtn1)" opacity="0.9"/>

  <!-- Mid mountains layer 2 -->
  <polygon points="0,460 100,300 220,400 380,260 520,370 660,260 800,360 960,260 1100,380 1260,270 1440,350 1440,540 0,540" fill="url(#mtn2)"/>

  <!-- Near hills layer 3 -->
  <path d="M0,510 Q180,440 350,490 Q520,540 700,480 Q880,420 1060,470 Q1240,520 1440,480 L1440,580 L0,580 Z" fill="url(#mtn3)"/>

  <!-- Rice terrace fields — bottom left -->
  <path d="M0,565 Q120,548 250,558 Q380,568 500,552 L500,600 Q380,618 250,608 Q120,598 0,615 Z" fill="url(#field1)" opacity="0.85"/>
  <path d="M0,610 Q120,596 250,606 Q380,616 500,600 L500,648 Q380,664 250,654 Q120,644 0,658 Z" fill="url(#field2)" opacity="0.8"/>
  <path d="M0,653 Q120,640 250,650 Q380,660 500,645 L500,695 Q380,710 250,700 Q120,690 0,703 Z" fill="#5cbf80" opacity="0.7"/>

  <!-- Rice terrace fields — bottom right -->
  <path d="M820,548 Q960,532 1100,544 Q1240,556 1440,536 L1440,590 Q1240,610 1100,598 Q960,586 820,602 Z" fill="url(#field1)" opacity="0.85"/>
  <path d="M820,596 Q960,582 1100,592 Q1240,602 1440,585 L1440,638 Q1240,655 1100,645 Q960,635 820,648 Z" fill="url(#field2)" opacity="0.8"/>
  <path d="M820,642 Q960,628 1100,638 Q1240,648 1440,632 L1440,680 Q1240,696 1100,686 Q960,676 820,688 Z" fill="#5cbf80" opacity="0.7"/>

  <!-- River winding through valley -->
  <path d="M280,720 Q320,650 340,600 Q360,555 400,530 Q440,510 490,520 Q540,530 580,510 Q620,490 660,500 Q700,510 740,490" stroke="url(#river)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M282,720 Q322,652 342,602 Q362,557 402,532 Q442,512 492,522 Q542,532 582,512" stroke="#3a98c0" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.3"/>

  <!-- Village houses (simple silhouettes) -->
  <!-- House cluster 1 -->
  <g transform="translate(560,490)">
    <rect x="0" y="10" width="32" height="22" fill="#d4b87a" opacity="0.75"/>
    <polygon points="-3,10 16,-8 35,10" fill="#a8773a" opacity="0.75"/>
    <rect x="6" y="20" width="8" height="12" fill="#7a4e20" opacity="0.6"/>
    <rect x="20" y="22" width="6" height="6" fill="#3a6b4a" opacity="0.5"/>
  </g>
  <g transform="translate(598,498)">
    <rect x="0" y="8" width="28" height="19" fill="#c9a96a" opacity="0.7"/>
    <polygon points="-2,8 14,-6 30,8" fill="#9a6e32" opacity="0.7"/>
  </g>
  <g transform="translate(635,503)">
    <rect x="0" y="6" width="24" height="17" fill="#dbb87a" opacity="0.68"/>
    <polygon points="-2,6 12,-5 26,6" fill="#a8773a" opacity="0.68"/>
  </g>

  <!-- House cluster 2 (right side) -->
  <g transform="translate(860,475)">
    <rect x="0" y="10" width="30" height="20" fill="#d4b87a" opacity="0.7"/>
    <polygon points="-3,10 15,-7 33,10" fill="#a8773a" opacity="0.7"/>
    <rect x="7" y="18" width="7" height="12" fill="#7a4e20" opacity="0.55"/>
  </g>
  <g transform="translate(896,482)">
    <rect x="0" y="8" width="26" height="18" fill="#c9a96a" opacity="0.65"/>
    <polygon points="-2,8 13,-5 28,8" fill="#9a6e32" opacity="0.65"/>
  </g>

  <!-- Trees -->
  <g opacity="0.82">
    <!-- Tree cluster left -->
    <ellipse cx="460" cy="502" rx="20" ry="26" fill="#1d6b40"/>
    <ellipse cx="460" cy="494" rx="14" ry="18" fill="#28854e"/>
    <rect x="457" y="518" width="6" height="10" fill="#5a3010" opacity="0.6"/>

    <ellipse cx="500" cy="506" rx="18" ry="24" fill="#1a6238"/>
    <ellipse cx="500" cy="499" rx="12" ry="16" fill="#247a44"/>
    <rect x="497" y="520" width="6" height="8" fill="#5a3010" opacity="0.6"/>

    <ellipse cx="530" cy="498" rx="16" ry="22" fill="#1d6b40"/>
    <ellipse cx="530" cy="492" rx="11" ry="15" fill="#28854e"/>
  </g>

  <g opacity="0.78">
    <!-- Tree cluster right -->
    <ellipse cx="960" cy="466" rx="18" ry="24" fill="#1d6b40"/>
    <ellipse cx="960" cy="459" rx="12" ry="16" fill="#28854e"/>
    <rect x="957" y="480" width="6" height="8" fill="#5a3010" opacity="0.6"/>

    <ellipse cx="992" cy="470" rx="16" ry="22" fill="#1a6238"/>
    <ellipse cx="992" cy="464" rx="11" ry="15" fill="#247a44"/>

    <ellipse cx="1020" cy="464" rx="17" ry="23" fill="#1d6b40"/>
    <ellipse cx="1020" cy="458" rx="12" ry="16" fill="#28854e"/>
  </g>

  <!-- Road/path through valley -->
  <path d="M700,720 Q720,660 730,610 Q740,560 755,520" stroke="#6b8a5a" stroke-width="5" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M702,720 Q722,662 732,612 Q742,562 757,522" stroke="#8aaa6a" stroke-width="2" fill="none" opacity="0.25" stroke-linecap="round"/>

  <!-- Atmospheric bottom haze -->
  <rect x="0" y="630" width="1440" height="90" fill="#1a3a2e" opacity="0.25"/>
  <rect x="0" y="680" width="1440" height="40" fill="#071A16" opacity="0.35"/>
</svg>
