<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" width="1440" height="720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a4a3a"/>
      <stop offset="50%" stop-color="#2d6b50"/>
      <stop offset="100%" stop-color="#4a8c6a"/>
    </linearGradient>
    <linearGradient id="mountain1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e5c42"/>
      <stop offset="100%" stop-color="#2e7a58"/>
    </linearGradient>
    <linearGradient id="mountain2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#256b4a"/>
      <stop offset="100%" stop-color="#3d8c68"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a8c5e"/>
      <stop offset="100%" stop-color="#4da870"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.10)"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1440" height="720" fill="url(#sky)"/>

  <!-- Stars -->
  <circle cx="200" cy="80" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="450" cy="50" r="1" fill="white" opacity="0.4"/>
  <circle cx="800" cy="30" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="1100" cy="70" r="1" fill="white" opacity="0.4"/>
  <circle cx="1300" cy="40" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="650" cy="90" r="1" fill="white" opacity="0.3"/>
  <circle cx="350" cy="120" r="1" fill="white" opacity="0.3"/>
  <circle cx="950" cy="100" r="1.5" fill="white" opacity="0.4"/>

  <!-- Far mountains -->
  <polygon points="0,380 180,200 360,340 500,220 680,300 800,180 920,280 1080,200 1200,310 1440,220 1440,480 0,480" fill="url(#mountain1)" opacity="0.85"/>

  <!-- Mid mountains -->
  <polygon points="0,420 150,280 300,380 460,260 600,340 780,240 900,320 1060,260 1200,360 1360,270 1440,330 1440,520 0,520" fill="url(#mountain2)"/>

  <!-- Cloud/mist layer -->
  <ellipse cx="300" cy="340" rx="300" ry="40" fill="url(#fog)"/>
  <ellipse cx="900" cy="310" rx="350" ry="35" fill="url(#fog)"/>
  <ellipse cx="1300" cy="350" rx="200" ry="30" fill="url(#fog)"/>

  <!-- Near hills & valley -->
  <path d="M0,520 Q200,460 400,500 Q600,540 800,490 Q1000,440 1200,480 Q1350,510 1440,490 L1440,720 L0,720 Z" fill="#2d6b4a"/>

  <!-- Rice terraces / fields -->
  <path d="M60,580 Q200,555 350,570 Q500,585 640,565 L640,620 Q500,640 350,625 Q200,610 60,630 Z" fill="#3a8a5e" opacity="0.8"/>
  <path d="M60,625 Q200,610 350,625 Q500,640 640,620 L640,670 Q500,685 350,672 Q200,658 60,675 Z" fill="#3f9462" opacity="0.75"/>
  <path d="M700,555 Q850,535 1000,550 Q1150,565 1300,545 L1300,600 Q1150,620 1000,605 Q850,590 700,608 Z" fill="#3a8a5e" opacity="0.8"/>
  <path d="M700,605 Q850,590 1000,605 Q1150,620 1300,600 L1300,650 Q1150,670 1000,655 Q850,640 700,658 Z" fill="#3f9462" opacity="0.75"/>

  <!-- Small path/road -->
  <path d="M680,720 Q710,650 720,580 Q730,510 740,460" stroke="#5eba82" stroke-width="8" fill="none" opacity="0.5" stroke-linecap="round"/>

  <!-- Houses/village -->
  <!-- House 1 -->
  <rect x="480" y="535" width="40" height="28" rx="2" fill="#f0e6c8"/>
  <polygon points="475,535 500,510 525,535" fill="#c4742a"/>
  <!-- House 2 -->
  <rect x="540" y="528" width="36" height="26" rx="2" fill="#eedbb0"/>
  <polygon points="535,528 558,505 581,528" fill="#b8692a"/>
  <!-- House 3 smaller -->
  <rect x="420" y="545" width="30" height="22" rx="2" fill="#f2e8ce"/>
  <polygon points="416,545 435,525 454,545" fill="#c47a30"/>
  <!-- Mosque/mosque-like -->
  <rect x="580" y="515" width="45" height="35" rx="2" fill="#e8dcc8"/>
  <polygon points="576,515 602,488 628,515" fill="#b06020"/>
  <circle cx="602" cy="482" r="5" fill="#d4a840"/>

  <!-- Trees -->
  <circle cx="380" cy="530" r="22" fill="#1d6b40" opacity="0.9"/>
  <circle cx="380" cy="522" r="16" fill="#27854e" opacity="0.8"/>
  <circle cx="650" cy="520" r="20" fill="#1d6b40" opacity="0.9"/>
  <circle cx="650" cy="513" r="15" fill="#27854e" opacity="0.8"/>
  <circle cx="820" cy="530" r="18" fill="#1d6b40" opacity="0.9"/>
  <circle cx="820" cy="523" r="13" fill="#27854e" opacity="0.8"/>
  <circle cx="1050" cy="525" r="20" fill="#1d6b40" opacity="0.9"/>
  <circle cx="1100" cy="518" r="16" fill="#27854e" opacity="0.85"/>

  <!-- Water/river hint -->
  <path d="M200,680 Q400,660 600,672 Q800,684 1000,670 Q1200,656 1440,665" stroke="#4a9dc0" stroke-width="4" fill="none" opacity="0.5"/>
  <path d="M200,685 Q400,668 600,678 Q800,690 1000,677 Q1200,663 1440,670" stroke="#4a9dc0" stroke-width="2" fill="none" opacity="0.3"/>

  <!-- Atmospheric haze at bottom -->
  <rect x="0" y="600" width="1440" height="120" fill="rgba(30,70,50,0.3)"/>
</svg>
